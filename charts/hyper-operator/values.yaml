# ─────────────────────────────────────────────────────────────────────────────
# Hyper Operator — Helm values
# ─────────────────────────────────────────────────────────────────────────────

replicaCount: 2  # HA default — leader election keeps only one active

image:
  repository: ghcr.io/taha2samy-3/hyper-operator
  pullPolicy: IfNotPresent
  # -- Defaults to the chart appVersion
  tag: ""

# ── Engine managed by the operator ───────────────────────────────────────────
engine:
  image:
    repository: ghcr.io/taha2samy-3/hyper-engine
    # -- Defaults to the chart appVersion, so operator and engine stay in lockstep
    tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Operator Settings ─────────────────────────────────────────────────────────
operator:
  # -- Enable leader election (required when replicaCount > 1). The replica holding
  # the Lease reconciles; the others stay as warm standbys.
  leaderElect: true
  # Lease timings. Must satisfy retryPeriod < renewDeadline < leaseDuration.
  leaderElection:
    # -- How long standbys wait after the leader's last renewal before taking over
    leaseDuration: 15s
    # -- How long the leader retries renewing before giving the Lease up
    renewDeadline: 10s
    # -- Interval between acquire/renew attempts
    retryPeriod: 2s
    # -- Release the Lease on shutdown so a standby takes over immediately (rolling upgrades)
    releaseOnCancel: true
  # -- Port of the Prometheus metrics endpoint (includes hypergate_operator_is_leader)
  metricsPort: 8080
  # Workload identity map (IP → pod, service account, SPIFFE ID, services, Cilium
  # identity), kept warm on every replica. Grants read access to pods, nodes,
  # services, endpointslices and ciliumendpoints.
  identity:
    # -- Build the identity cache
    enabled: false
    # -- Trust domain of the SPIFFE IDs (spiffe://<trustDomain>/ns/<ns>/sa/<sa>)
    trustDomain: cluster.local
    # -- Pod label keys kept in the map
    labelKeys:
      - app
      - version
      - app.kubernetes.io/name
      - app.kubernetes.io/instance
      - app.kubernetes.io/component
      - app.kubernetes.io/version
    # Leader-only delta xDS server that streams the map to engines (needs enabled).
    server:
      # -- Serve identities and point the identity Service at the leader
      enabled: false
      # -- Port of the identity stream server
      port: 9444
      # -- Selector-less Service engines connect to; the leader writes its EndpointSlice
      serviceName: hyper-operator-identity
      # -- TLS Secret (tls.crt, tls.key) for the server; issued by cert-manager when certManager.enabled
      certSecret: hyper-operator-identity-cert
  # -- Enable the validating webhook server
  enableWebhooks: true
  # -- Webhook server port
  webhookPort: 9443
  # -- Webhook TLS Secret name (created by cert-manager or manually)
  webhookCertSecret: "webhook-server-cert"

# ── Engine metrics ──────────────────────────────────────────────────────────
# Engines serve Prometheus metrics on their health port (9003, /metrics) and carry
# prometheus.io/* annotations. With the Prometheus Operator, enable a PodMonitor.
engineMetrics:
  podMonitor:
    # -- Create a PodMonitor for engine pods (requires the monitoring.coreos.com CRDs)
    enabled: false
    # -- Scrape interval
    interval: 30s
    # -- Extra labels, e.g. the release label your Prometheus selects
    labels: {}

# ── cert-manager integration ──────────────────────────────────────────────────
certManager:
  # -- Set to true if cert-manager is installed; creates Certificate + Issuer
  enabled: true
  issuerName: "hyper-selfsigned-issuer"
  certificateName: "hyper-operator-cert"
  duration: "8760h"   # 1 year
  renewBefore: "360h" # 15 days

# ── Service (webhook) ─────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 443
  targetPort: 9443

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# ── Security ─────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []

podAntiAffinity:
  enabled: true
  topologyKey: "kubernetes.io/hostname"

podAnnotations: {}

# CRDs are installed from the chart's crds/ directory on first install.
# Use `helm install --skip-crds` to manage them externally, and apply
# charts/hyper-operator/crds/ yourself on upgrades (Helm never upgrades CRDs).

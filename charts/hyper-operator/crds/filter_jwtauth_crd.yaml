apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jwtauthfilters.hyper.io
spec:
  group: hyper.io
  names:
    kind: JwtAuthFilter
    listKind: JwtAuthFilterList
    plural: jwtauthfilters
    singular: jwtauthfilter
    shortNames:
    - jwtf
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-validations:
            - rule: "has(self.jwksEndpoint) || has(self.localSecretRef) || has(self.introspectionEndpoint)"
              message: "one of jwksEndpoint, localSecretRef or introspectionEndpoint is required"
            properties:
              source:
                type: string
                enum: ["header", "query", "cookie"]
              headerName:
                type: string
              queryParam:
                type: string
              cookieName:
                type: string
              jwksEndpoint:
                type: string
              jwksRefreshInterval:
                type: string
              localSecretRef:
                type: object
                required: ["name", "key"]
                properties:
                  name:
                    type: string
                  key:
                    type: string
              algorithm:
                type: string
              issuer:
                type: string
              audience:
                type: string
              claimMappings:
                type: object
                additionalProperties:
                  type: string
              introspectionEndpoint:
                type: string
              introspectionAuthSecretRef:
                type: object
                required: ["name", "key"]
                properties:
                  name:
                    type: string
                  key:
                    type: string
              introspectionTimeout:
                type: string
              failOpen:
                type: boolean
              stripToken:
                type: boolean
          status:
            type: object

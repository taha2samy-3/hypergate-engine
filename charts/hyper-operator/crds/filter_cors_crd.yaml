apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: corsfilters.hyper.io
spec:
  group: hyper.io
  names:
    kind: CorsFilter
    listKind: CorsFilterList
    plural: corsfilters
    singular: corsfilter
    shortNames:
    - corsf
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-validations:
            - rule: "(has(self.allowOrigins) && size(self.allowOrigins) > 0) || (has(self.allowOriginRegex) && size(self.allowOriginRegex) > 0)"
              message: "allowOrigins or allowOriginRegex is required"
            - rule: "!(has(self.allowCredentials) && self.allowCredentials && has(self.allowOrigins) && '*' in self.allowOrigins)"
              message: "allowCredentials cannot be combined with allowOrigins \"*\""
            properties:
              allowOrigins:
                type: array
                items:
                  type: string
              allowOriginRegex:
                type: array
                items:
                  type: string
              allowMethods:
                type: array
                items:
                  type: string
              allowHeaders:
                type: array
                items:
                  type: string
              exposeHeaders:
                type: array
                items:
                  type: string
              allowCredentials:
                type: boolean
              maxAge:
                type: integer
                minimum: 0
              blockDisallowedOrigins:
                type: boolean
          status:
            type: object

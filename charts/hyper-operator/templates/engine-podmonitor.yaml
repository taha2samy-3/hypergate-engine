{{- if .Values.engineMetrics.podMonitor.enabled }}
# Scrapes the Hypergate engines (the operator's DaemonSets, label app=hyper-engine)
# in every namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "hyper-operator.fullname" . }}-engines
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
    {{- with .Values.engineMetrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: hyper-engine
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.engineMetrics.podMonitor.interval }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyper-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hyper-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyper-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hyper-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "hyper-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address=:{{ .Values.operator.metricsPort }}
            {{- if .Values.operator.leaderElect }}
            {{- with .Values.operator.leaderElection }}
            - --leader-elect
            - --leader-elect-lease-duration={{ .leaseDuration }}
            - --leader-elect-renew-deadline={{ .renewDeadline }}
            - --leader-elect-retry-period={{ .retryPeriod }}
            - --leader-elect-release-on-cancel={{ .releaseOnCancel }}
            {{- end }}
            {{- end }}
            {{- with .Values.operator.identity }}
            {{- if .enabled }}
            - --identity-cache
            - --identity-trust-domain={{ .trustDomain }}
            - --identity-label-keys={{ join "," .labelKeys }}
            {{- end }}
            {{- end }}
            {{- if include "hyper-operator.identityServer" . }}
            - --identity-server
            - --identity-server-address=:{{ .Values.operator.identity.server.port }}
            - --identity-server-cert-dir=/tmp/identity-server-certs
            - --identity-service-name={{ .Values.operator.identity.server.serviceName }}
            {{- end }}
          env:
            - name: ENABLE_WEBHOOKS
              value: {{ .Values.operator.enableWebhooks | quote }}
            # Engine image used when a HyperConfig does not set spec.engineImage.
            - name: ENGINE_IMAGE
              value: {{ printf "%s:%s" .Values.engine.image.repository (.Values.engine.image.tag | default .Chart.AppVersion) | quote }}
            {{- if include "hyper-operator.identityServer" . }}
            # The leader writes its own address into the identity Service's EndpointSlice.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          ports:
            - containerPort: {{ .Values.operator.webhookPort }}
              name: webhook-server
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: {{ .Values.operator.metricsPort }}
              name: metrics
              protocol: TCP
            {{- if include "hyper-operator.identityServer" . }}
            - containerPort: {{ .Values.operator.identity.server.port }}
              name: identity
              protocol: TCP
            {{- end }}
          volumeMounts:
            {{- if .Values.operator.enableWebhooks }}
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
            {{- end }}
            {{- if include "hyper-operator.identityServer" . }}
            - mountPath: /tmp/identity-server-certs
              name: identity-cert
              readOnly: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.operator.enableWebhooks }}
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ .Values.operator.webhookCertSecret }}
        {{- end }}
        {{- if include "hyper-operator.identityServer" . }}
        - name: identity-cert
          secret:
            defaultMode: 420
            secretName: {{ .Values.operator.identity.server.certSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "hyper-operator.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      terminationGracePeriodSeconds: 10

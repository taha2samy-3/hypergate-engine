apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyper-operator.fullname" . }}-role
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hyper.io"]
    resources:
      - hyperconfigs
      - hyperredis
      - hyperroutes
      - hyperchains
      - ratelimitfilters
      - headermodifierfilters
      - denyfilters
      - correlationidfilters
      - redismetadataenricherfilters
      - apikeyfilters
      - externalauthfilters
      - firewallfilters
      - jwtauthfilters
      - corsfilters
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["hyper.io"]
    resources:
      - hyperconfigs/status
      - hyperredis/status
      - hyperroutes/status
      - hyperchains/status
      - ratelimitfilters/status
      - headermodifierfilters/status
      - denyfilters/status
      - correlationidfilters/status
      - redismetadataenricherfilters/status
      - apikeyfilters/status
      - externalauthfilters/status
      - firewallfilters/status
      - jwtauthfilters/status
      - corsfilters/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["hyper.io"]
    resources:
      - hyperconfigs/finalizers
      - hyperredis/finalizers
      - hyperroutes/finalizers
      - hyperchains/finalizers
      - ratelimitfilters/finalizers
      - headermodifierfilters/finalizers
      - denyfilters/finalizers
      - correlationidfilters/finalizers
      - redismetadataenricherfilters/finalizers
      - apikeyfilters/finalizers
      - externalauthfilters/finalizers
      - firewallfilters/finalizers
      - jwtauthfilters/finalizers
      - corsfilters/finalizers
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "namespaces", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ext_proc attachment: generated filter objects and ReferenceGrant; HTTPRoutes
  # and Gateways are only read.
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyextensionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumenvoyextprocfilters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if .Values.operator.identity.enabled }}
  # Identity cache (read only, every replica).
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if include "hyper-operator.identityServer" . }}
  # Identity server: validate engine tokens.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyper-operator.fullname" . }}-rolebinding
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hyper-operator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "hyper-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if include "hyper-operator.identityServer" . }}
---
# The leader writes the identity Service's EndpointSlice in its own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hyper-operator.fullname" . }}-identity-endpoints
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hyper-operator.fullname" . }}-identity-endpoints
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hyper-operator.fullname" . }}-identity-endpoints
subjects:
  - kind: ServiceAccount
    name: {{ include "hyper-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

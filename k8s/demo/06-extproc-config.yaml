apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: hyper-engine-ext-proc
  namespace: default
spec:
  services:
    - name: cilium-gateway-demo-gateway
      namespace: default
  backendServices:
    - name: hyper-engine-svc
      namespace: hyper-system
      number:
        - "9001"
  resources:
    - "@type": type.googleapis.com/envoy.config.filter.network.http_connection_manager.v2.HttpFilter
      name: envoy.filters.http.ext_proc
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
        grpc_service:
          envoy_grpc:
            cluster_name: "default/hyper-engine-ext-proc/hyper-system:hyper-engine-svc:9001"
          timeout: 5s
        failure_mode_allow: false
        # Lets filters (e.g. a FirewallFilter with inspectBody) ask for the request body.
        allow_mode_override: true
        # Envoy's view of the downstream peer; the engine uses it to resolve the client IP
        # instead of trusting client-supplied X-Forwarded-For.
        request_attributes:
          - source.address
        processing_mode:
          request_header_mode: SEND
          response_header_mode: SEND
          request_body_mode: NONE
          response_body_mode: NONE
          request_trailer_mode: SKIP
          response_trailer_mode: SKIP
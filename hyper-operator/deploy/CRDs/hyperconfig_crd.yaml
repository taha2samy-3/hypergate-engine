apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hyperconfigs.hyper.io
spec:
  group: hyper.io
  names:
    kind: HyperConfig
    listKind: HyperConfigList
    plural: hyperconfigs
    singular: hyperconfig
    shortNames:
      - hcfg 
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - redisServiceRef
              properties:
                serverAddress:
                  type: string
                  default: "0.0.0.0:9001"
                maxConcurrentStreams:
                  type: integer
                logLevel:
                  type: string
                  enum:
                    - DEBUG
                    - INFO
                    - WARN
                    - ERROR
                  default: "INFO"
                targetNamespace:
                  type: string
                  default: "hyper-system"
                engineImage:
                  type: string
                  description: "Defaults to the engine image matching the operator release."
                engineResources:
                  type: object
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                trustedProxyHops:
                  type: integer
                  minimum: 0
                  description: "Proxies in front of Envoy whose X-Forwarded-For entries are trusted."
                redisServiceRef:
                  type: string
                defaultChain:
                  type: string
                poolPrewarmSize:
                  type: integer
                  default: 5000
                initialHeaderCapacity:
                  type: integer
                  default: 64
                preallocBodyBufferBytes:
                  type: integer
                  default: 65536
            status:
              type: object
              properties:
                state:
                  type: string
                message:
                  type: string
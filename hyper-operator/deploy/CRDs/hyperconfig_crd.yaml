apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hyperconfigs.hyper.io
spec:
  group: hyper.io
  names:
    kind: HyperConfig
    listKind: HyperConfigList
    plural: hyperconfigs
    singular: hyperconfig
    shortNames:
      - hcfg 
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Server Address
        type: string
        jsonPath: .spec.serverAddress
      - name: Log Level
        type: string
        jsonPath: .spec.logLevel
      - name: Target Namespace
        type: string
        jsonPath: .spec.targetNamespace
      - name: State
        type: string
        jsonPath: .status.state
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                serverAddress:
                  type: string
                  default: "0.0.0.0:9001"
                maxConcurrentStreams:
                  type: integer
                logLevel:
                  type: string
                  enum:
                    - DEBUG
                    - INFO
                    - WARN
                    - ERROR
                  default: "INFO"
                targetNamespace:
                  type: string
                  default: "hyper-system"
                engineImage:
                  type: string
                  description: "Defaults to the engine image matching the operator release."
                engineResources:
                  type: object
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                trustedProxyHops:
                  type: integer
                  minimum: 0
                  description: "Proxies in front of Envoy whose X-Forwarded-For entries are trusted."
                redisServiceRef:
                  type: string
                  description: "Deprecated and ignored; filters name their Redis service directly."
                defaultChain:
                  type: string
                  description: "HyperChain for requests that match no HyperRoute and have no defaultChains entry for their traffic class."
                defaultChains:
                  type: object
                  description: "HyperChain for unmatched requests, by traffic class."
                  properties:
                    northSouth:
                      type: string
                      description: "Unmatched requests that entered through a gateway."
                    eastWest:
                      type: string
                      description: "Unmatched calls between workloads."
                unknownSource:
                  type: string
                  enum: ["Deny", "Default"]
                  default: Deny
                  description: "East-west requests whose caller is not in the identity map: Deny (503) or Default (continue; only network selectors can match). Applies only with the operator's identity server."
                extProc:
                  type: object
                  description: "Where the operator attaches this engine to Envoy. Nothing is attached unless listed. HTTPRoutes are never created or edited."
                  properties:
                    gateways:
                      type: array
                      maxItems: 64
                      description: "Envoy Gateway Gateways that get an EnvoyExtensionPolicy pointing at this engine."
                      items:
                        type: object
                        required: ["namespace", "name"]
                        properties:
                          namespace:
                            type: string
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                    namespaces:
                      type: array
                      maxItems: 256
                      description: "Namespaces that get the CiliumEnvoyExtProcFilter \"hypergate\" (inactive until Cilium ships the CRD)."
                      items:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    failureMode:
                      type: string
                      enum: ["FailClosed", "FailOpen"]
                      default: FailClosed
                    messageTimeout:
                      type: string
                      description: "Deadline for each ext_proc message (Gateway API duration). Default 2500ms."
                      pattern: '^([0-9]{1,5}(h|m|s|ms)){1,4}$'
                poolPrewarmSize:
                  type: integer
                  default: 5000
                initialHeaderCapacity:
                  type: integer
                  default: 64
                preallocBodyBufferBytes:
                  type: integer
                  default: 65536
            status:
              type: object
              properties:
                state:
                  type: string
                message:
                  type: string
                conditions:
                  type: array
                  description: "ext_proc attachment: EnvoyGatewayPolicies, CiliumFilters, HTTPRoutes."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["type"]
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
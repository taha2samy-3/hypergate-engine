apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hyperroutes.hyper.io
spec:
  group: hyper.io
  names:
    kind: HyperRoute
    listKind: HyperRouteList
    plural: hyperroutes
    singular: hyperroute
    shortNames:
      - hrt
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Priority
        type: integer
        jsonPath: .spec.priority
      - name: Target Policy
        type: string
        jsonPath: .spec.targetPolicy
      - name: State
        type: string
        jsonPath: .status.state
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - priority
                - targetPolicy
                - matches
              properties:
                priority:
                  type: integer
                targetPolicy:
                  type: string
                matches:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      traffic:
                        type: string
                        description: Restricts the match to one traffic class. Default Any.
                        enum:
                          - NorthSouth
                          - EastWest
                          - Any
                      sources:
                        type: array
                        description: Callers this match applies to, as prefix:value selectors. Any entry may match.
                        maxItems: 64
                        items:
                          type: string
                          pattern: '^(any|external|ip:[0-9A-Fa-f.:]+|cidr:[0-9A-Fa-f.:]+/[0-9]{1,3}|service:[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?|namespace:[a-z0-9]([-a-z0-9]*[a-z0-9])?|sa:[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9.]*[a-z0-9])?|spiffe://[^/]+/ns/[^/]+/sa/[^/]+|labels:[^ ]+=[^ ]*)$'
                      destinations:
                        type: array
                        description: Targets this match applies to, as prefix:value selectors. Any entry may match.
                        maxItems: 64
                        items:
                          type: string
                          pattern: '^(any|ip:[0-9A-Fa-f.:]+|cidr:[0-9A-Fa-f.:]+/[0-9]{1,3}|host:(\*\.)?[A-Za-z0-9_.-]+|service:[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?|namespace:[a-z0-9]([-a-z0-9]*[a-z0-9])?)$'
                      pathPrefix:
                        type: string
                      pathRegexPattern:
                        type: string
                      headers:
                        type: object
                        additionalProperties:
                          type: string
            status:
              type: object
              properties:
                state:
                  type: string
                message:
                  type: string
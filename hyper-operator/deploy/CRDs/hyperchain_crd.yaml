apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hyperchains.hyper.io
spec:
  group: hyper.io
  names:
    kind: HyperChain
    listKind: HyperChainList
    plural: hyperchains
    singular: hyperchain
    shortNames:
    - hc
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: State
      type: string
      jsonPath: .status.state
    - name: Message
      type: string
      jsonPath: .status.message
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - filters
            properties:
              filters:
                type: array
                items:
                  type: object
                  required:
                  - kind
                  - name
                  properties:
                    kind:
                      type: string
                      enum:
                      - RateLimitFilter
                      - HeaderModifierFilter
                      - DenyFilter
                      - CorrelationIdFilter
                      - RedisMetadataEnricherFilter
                      - ApiKeyFilter
                      - ExternalAuthFilter
                      - FirewallFilter
                      - JwtAuthFilter
                      - CorsFilter
                    name:
                      type: string
                    audit:
                      type: boolean
                      description: "Overrides the chain's mode for this filter: true records its denials without enforcing them, false enforces it even in an Audit chain."
              mode:
                type: string
                enum: ["Enforce", "Audit"]
                default: Enforce
                description: "Audit counts and logs denials and failures (hypergate_audit_denies_total) without enforcing them."
              timeout:
                type: string
                pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m))+$'
                description: "Deadline on the chain's work for each ext_proc message, e.g. 300ms. Keep it below Envoy's message timeout."
              maxConcurrency:
                type: integer
                minimum: 0
                description: "Requests that may run this chain's filters at the same time on one engine (0 = no limit)."
              onTimeout:
                type: string
                enum: ["Deny", "Allow"]
                description: "Deny (default, 503) or Allow (continue without the remaining filters)."
              onOverload:
                type: string
                enum: ["Deny", "Allow"]
                description: "Deny (default, 503 with Retry-After) or Allow (skip the chain)."
          status:
            type: object
            properties:
              state:
                type: string
              message:
                type: string

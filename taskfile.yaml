version: '3'

includes:
  engine: ./tasks/engine.yaml
  operator: ./tasks/operator.yaml
  k8s: ./tasks/k8s.yaml
  test: ./tasks/tests.yaml
  docs: ./tasks/docs.yaml

tasks:
  default:
    desc: "Verify prerequisites and run all integration test scenarios"
    cmds:
      - task: check-prereqs
      - task: test:all

  check-prereqs:
    desc: "Check if required CLI tools (Docker, Pipenv, Pytest) are available"
    cmds:
      - docker --version || (echo "Docker not found" && exit 1)
      - docker compose version || (echo "Docker Compose not found" && exit 1)
      - pipenv --version || (echo "Pipenv not found" && exit 1)
      - pipenv run pytest --version || (echo "pytest is not installed inside pipenv" && exit 1)
    silent: true
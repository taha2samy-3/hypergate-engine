name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  # Required for the /retest ChatOps command in 05-chatops.yaml to work —
  # createWorkflowDispatch() only works on workflows that have this trigger.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  pr-title-check:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      chart_changed: ${{ steps.filter.outputs.chart_changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code_changed:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'hyper-operator/Dockerfile'
            chart_changed:
              - 'charts/**'

  go-unit-tests:
    name: Go Unit Tests & Vet
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Run Go Vet
        shell: bash
        run: go vet ./...

      - name: Run Go Unit Tests
        shell: bash
        run: |
          go test -race -count=1 -timeout=120s \
            ./internal/engine/... \
            ./internal/router/... \
            ./internal/filters/jwt_auth/... \
            ./internal/memory/...

  helm-lint:
    name: Helm Chart Lint
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.chart_changed == 'true' || needs.detect-changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint engine chart
        run: helm lint charts/hypergate-engine

      - name: Lint operator chart
        run: helm lint charts/hyper-operator

  build-dry-run:
    name: Verify Multi-Platform Build (${{ matrix.target }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [engine, operator]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-Run Build with Docker Bake
        uses: docker/bake-action@v3
        with:
          targets: ${{ matrix.target }}
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

name: Deploy to Test/Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234 or v1.0.0)'
        required: true
        type: string
      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - all
          - engine
          - operator
        default: all

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  just-echo-message:
    name: echo
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello"


name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234 or v1.0.0)'
        required: true
        type: string
      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - all
          - engine
          - operator
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [engine, operator]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Image Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      # On manual dispatch, skip components not selected by the user.
      # 'all' means both engine and operator should run.
      - name: Check Component Selection
        id: check
        shell: bash
        run: |
          COMPONENT="${{ inputs.component }}"
          TARGET="${{ matrix.target }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || \
             [ "$COMPONENT" = "all" ] || \
             [ "$COMPONENT" = "$TARGET" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Push and Attest Image
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/build-push-image
        with:
          target: ${{ matrix.target }}
          image_tag: ${{ steps.tag.outputs.value }}
          registry: ghcr.io/taha2samy-3

  update-gitops:
    name: Update GitOps Manifests (Staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update operator image tag in deploy manifest
        shell: bash
        run: |
          sed -i "s|image: ghcr.io/taha2samy-3/hyper-operator:.*|image: ghcr.io/taha2samy-3/hyper-operator:${{ steps.tag.outputs.value }}|g" \
            hyper-operator/deploy/deployment.yaml

      - name: Commit and Push GitOps changes
        shell: bash
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add hyper-operator/deploy/deployment.yaml
          git diff-index --quiet HEAD || git commit -m "chore(staging): update operator image to ${{ steps.tag.outputs.value }} [skip ci]"
          git push origin main

name: 'Run Tests'
description: 'Runs Go unit tests and pytest integration scenarios'

runs:
  using: 'composite'
  steps:
    - name: Set up Go Environment
      uses: ./.github/actions/setup-go-env

    - name: Run Go Unit Tests
      shell: bash
      run: |
        go test -race -count=1 -timeout=120s \
          ./internal/engine/... \
          ./internal/router/... \
          ./internal/filters/jwt_auth/... \
          ./internal/memory/...

    - name: Set up Python Environment
      uses: ./.github/actions/setup-python-env

    - name: Install Pipenv Dependencies
      shell: bash
      run: |
        pipenv install --dev --skip-lock

    - name: Run API Key Integration Tests
      shell: bash
      run: |
        task tests:test-api-key

    - name: Run Rate Limit Integration Tests
      shell: bash
      run: |
        task tests:test-ratelimit

    - name: Run Header Modification Integration Tests
      shell: bash
      run: |
        task tests:modification-filter

    - name: Run Metadata Enrichment Integration Tests
      shell: bash
      run: |
        task tests:metadata-enrichment

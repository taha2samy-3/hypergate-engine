<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hypergate">
  <title>Hypergate</title>
  <defs>
    <linearGradient id="hg-fill" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="hg-shine" x1="32" y1="3" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z" fill="url(#hg-fill)"/>
  <path d="M32 3 57.1 17.5V32H6.9V17.5Z" fill="url(#hg-shine)"/>
  <!-- the gate: two pillars -->
  <path d="M20.5 19.5v25M43.5 19.5v25" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  <!-- traffic passing through the checkpoint -->
  <path d="M28 24.5 35.5 32 28 39.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

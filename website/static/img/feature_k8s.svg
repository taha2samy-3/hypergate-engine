<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="k8sGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)">
    <!-- Kubernetes Helm 3D -->
    <path d="M 0 -70 L 25 -25 L 70 0 L 25 25 L 0 70 L -25 25 L -70 0 L -25 -25 Z" fill="none" stroke="url(#k8sGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </path>
    <!-- Inner complex structure -->
    <polygon points="0,-40 35,-12 22,28 -22,28 -35,-12" fill="rgba(16, 185, 129, 0.15)" stroke="url(#k8sGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="12" fill="url(#k8sGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-40" r="5" fill="#fff"/>
    <circle cx="35" cy="-12" r="5" fill="#fff"/>
    <circle cx="22" cy="28" r="5" fill="#fff"/>
    <circle cx="-22" cy="28" r="5" fill="#fff"/>
    <circle cx="-35" cy="-12" r="5" fill="#fff"/>
  </g>
</svg>

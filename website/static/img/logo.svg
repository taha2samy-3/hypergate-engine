<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)">
    <!-- Outer Hexagon -->
    <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z" fill="rgba(56, 189, 248, 0.1)" stroke="url(#portalGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <!-- Inner Hexagon -->
    <path d="M 0 -40 L 35 -20 L 35 20 L 0 40 L -35 20 L -35 -20 Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <!-- Central Core -->
    <circle cx="0" cy="0" r="15" fill="url(#portalGrad)" filter="url(#neonGlow)"/>
    <!-- Orbital Lines -->
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" transform="rotate(-45)" />
  </g>
</svg>
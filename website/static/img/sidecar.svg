<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)">
    <!-- Main Engine Block -->
    <path d="M -20 -60 L 32 -30 L 32 30 L -20 60 L -72 30 L -72 -30 Z" fill="rgba(56, 189, 248, 0.1)" stroke="url(#cyberGrad)" stroke-width="4" stroke-linejoin="round" filter="url(#neonGlow)"/>
    
    <!-- Connected Sidecar Block -->
    <path d="M 40 -10 L 70 5 L 70 35 L 40 50 L 10 35 L 10 5 Z" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="3" stroke-linejoin="round" filter="url(#neonGlow)"/>
    
    <!-- UDS Connection Pipe -->
    <path d="M 20 10 L 40 10" stroke="#06b6d4" stroke-width="4" stroke-dasharray="2,2"/>
    <path d="M 20 15 L 40 15" stroke="#ec4899" stroke-width="4" stroke-dasharray="2,2"/>
  </g>
</svg>

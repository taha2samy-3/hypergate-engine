<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="perfGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)">
    <!-- Energy Rings -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#perfGrad)" stroke-width="4" stroke-dasharray="20, 10" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#perfGrad)" stroke-width="2" stroke-dasharray="50, 20" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Lightning Bolt 3D -->
    <path d="M 10 -40 L -20 5 L 0 5 L -10 40 L 20 -5 L 0 -5 Z" fill="url(#perfGrad)" filter="url(#glow)"/>
    <path d="M 10 -40 L -20 5 L 0 5 L -10 40 L 20 -5 L 0 -5 Z" fill="#fff" opacity="0.5" transform="scale(0.8)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Client IP resolution</title>
  <desc id="d">The engine builds an address chain from X-Forwarded-For entries followed by the peer address Envoy observed. The client is the entry trusted_proxy_hops positions from the right. With one trusted load balancer the client is the address that load balancer appended; entries further left are client-controlled and ignored.</desc>
  <defs>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .h { font-size: 16px; font-weight: 700; }
      .b { font-size: 14px; }
      .m { font-size: 16px; font-weight: 700; font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .s { font-size: 13px; fill: #94A3B8; }
      .cap { font-size: 12.5px; fill: #94A3B8; letter-spacing: 0.08em; }
      .box { fill: #1E293B; stroke: #334155; stroke-width: 1.5; }
      .acc { fill: #1E293B; stroke: #6366F1; stroke-width: 2; }
      .ln { stroke: #94A3B8; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="18" fill="#0F172A"/>
  <rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="46" class="cap">EXAMPLE: ONE LOAD BALANCER IN FRONT OF ENVOY</text>

  <rect x="36" y="64" width="250" height="96" rx="12" class="box"/>
  <text x="54" y="92" class="h">Client 203.0.113.7</text>
  <text x="54" y="116" class="s">sends a forged header</text>
  <text x="54" y="138" class="s">X-Forwarded-For: 198.51.100.9</text>

  <rect x="336" y="64" width="250" height="96" rx="12" class="box"/>
  <text x="354" y="92" class="h">Load balancer 10.0.0.5</text>
  <text x="354" y="116" class="s">trusted proxy, appends the</text>
  <text x="354" y="138" class="s">address it saw: 203.0.113.7</text>

  <rect x="636" y="64" width="250" height="96" rx="12" class="acc"/>
  <text x="654" y="92" class="h">Envoy</text>
  <text x="654" y="116" class="s">downstream peer: 10.0.0.5</text>
  <text x="654" y="138" class="s">sent as source.address</text>

  <rect x="936" y="64" width="228" height="96" rx="12" class="acc"/>
  <text x="954" y="92" class="h">Engine</text>
  <text x="954" y="116" class="s">server.client_ip.</text>
  <text x="954" y="138" class="s">trusted_proxy_hops: 1</text>

  <path d="M286 112 H328" class="ln" marker-end="url(#a)"/>
  <path d="M586 112 H628" class="ln" marker-end="url(#a)"/>
  <path d="M886 112 H928" class="ln" marker-end="url(#a)"/>

  <text x="36" y="214" class="cap">ADDRESS CHAIN = X-FORWARDED-FOR ENTRIES + ENVOY PEER</text>

  <text x="330" y="246" class="s" text-anchor="middle">position 2 from the right</text>
  <text x="600" y="246" class="s" text-anchor="middle">position 1</text>
  <text x="870" y="246" class="s" text-anchor="middle">position 0</text>

  <rect x="210" y="258" width="240" height="78" rx="12" fill="#2A0F18" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="330" y="292" class="m" text-anchor="middle" style="fill:#FDA4AF">198.51.100.9</text>
  <text x="330" y="318" class="s" text-anchor="middle">XFF, written by the client</text>

  <rect x="480" y="258" width="240" height="78" rx="12" fill="#0B2A22" stroke="#10B981" stroke-width="2.5"/>
  <text x="600" y="292" class="m" text-anchor="middle" style="fill:#6EE7B7">203.0.113.7</text>
  <text x="600" y="318" class="s" text-anchor="middle" style="fill:#A7F3D0">XFF, appended by the LB</text>

  <rect x="750" y="258" width="240" height="78" rx="12" fill="#082F3A" stroke="#22D3EE" stroke-width="2"/>
  <text x="870" y="292" class="m" text-anchor="middle" style="fill:#A5F3FC">10.0.0.5</text>
  <text x="870" y="318" class="s" text-anchor="middle">Envoy peer (source.address)</text>

  <!-- hop arrows -->
  <path d="M870 340 V372" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#ac)"/>
  <text x="870" y="396" class="b" text-anchor="middle" style="fill:#A5F3FC">hops: 0 → 10.0.0.5</text>

  <path d="M870 408 V424 H600 V346" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="740" y="450" class="b" text-anchor="middle" style="fill:#6EE7B7">hops: 1 → client = 203.0.113.7</text>

  <text x="330" y="372" class="s" text-anchor="middle">client-controlled:</text>
  <text x="330" y="392" class="s" text-anchor="middle">never used</text>

  <text x="36" y="500" class="s">Without source.address the rightmost X-Forwarded-For entry is used as the peer; that is only safe when Envoy runs with use_remote_address: true.</text>
  <text x="36" y="524" class="s">The resolved address feeds rate-limit keys ip / client_ip / remote_ip and the enricher's {client_ip}. If hops exceed the chain length, the leftmost entry is used.</text>
</svg>

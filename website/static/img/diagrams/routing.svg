<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Routing decision flow</title>
  <desc id="d">When request headers arrive the engine rejects the request with 503 if no policy is loaded. Otherwise routes are matched in order and the first match wins. A matched route runs its chain, or returns 503 if the chain is not loaded. Without a match the default chain runs; without a default chain the request passes through without policy.</desc>
  <defs>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .h { font-size: 16px; font-weight: 700; }
      .b { font-size: 14px; }
      .s { font-size: 13px; fill: #94A3B8; }
      .cap { font-size: 12.5px; fill: #94A3B8; letter-spacing: 0.08em; }
      .box { fill: #1E293B; stroke: #334155; stroke-width: 1.5; }
      .acc { fill: #1E293B; stroke: #6366F1; stroke-width: 2; }
      .dia { fill: #172033; stroke: #22D3EE; stroke-width: 2; }
      .ok { fill: #0B2A22; stroke: #10B981; stroke-width: 2; }
      .bad { fill: #3B0D1A; stroke: #F43F5E; stroke-width: 2; }
      .warn { fill: #2D1F05; stroke: #F59E0B; stroke-width: 2; }
      .ln { stroke: #94A3B8; stroke-width: 2; fill: none; }
      .y { font-size: 13px; fill: #6EE7B7; font-weight: 600; }
      .n { font-size: 13px; fill: #FDA4AF; font-weight: 600; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#0F172A"/>
  <rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="52" class="cap">ONCE PER REQUEST, ON THE SNAPSHOT THE STREAM OPENED WITH</text>

  <!-- main row -->
  <rect x="36" y="110" width="150" height="80" rx="12" class="acc"/>
  <text x="111" y="145" class="h" text-anchor="middle">Request</text>
  <text x="111" y="167" class="h" text-anchor="middle">headers</text>

  <polygon points="215,150 290,95 365,150 290,205" class="dia"/>
  <text x="290" y="146" class="b" text-anchor="middle">policy</text>
  <text x="290" y="166" class="b" text-anchor="middle">loaded?</text>

  <rect x="400" y="110" width="190" height="80" rx="12" class="acc"/>
  <text x="495" y="145" class="h" text-anchor="middle">Match routes</text>
  <text x="495" y="168" class="s" text-anchor="middle">in order, first match wins</text>

  <polygon points="625,150 700,95 775,150 700,205" class="dia"/>
  <text x="700" y="146" class="b" text-anchor="middle">route</text>
  <text x="700" y="166" class="b" text-anchor="middle">matched?</text>

  <polygon points="805,150 880,95 955,150 880,205" class="dia"/>
  <text x="880" y="146" class="b" text-anchor="middle">chain</text>
  <text x="880" y="166" class="b" text-anchor="middle">loaded?</text>

  <rect x="990" y="110" width="174" height="80" rx="12" class="ok"/>
  <text x="1077" y="145" class="h" text-anchor="middle">Run target chain</text>
  <text x="1077" y="168" class="s" text-anchor="middle" style="fill:#A7F3D0">route.target_chain</text>

  <path d="M186 150 H207" class="ln" marker-end="url(#a)"/>
  <path d="M365 150 H392" class="ln" marker-end="url(#a)"/>
  <text x="378" y="140" class="y" text-anchor="middle">yes</text>
  <path d="M590 150 H617" class="ln" marker-end="url(#a)"/>
  <path d="M775 150 H797" class="ln" marker-end="url(#a)"/>
  <text x="786" y="140" class="y" text-anchor="middle">yes</text>
  <path d="M955 150 H982" class="ln" marker-end="url(#a)"/>
  <text x="969" y="140" class="y" text-anchor="middle">yes</text>

  <!-- fail-closed boxes -->
  <path d="M290 205 V242" class="ln" marker-end="url(#a)"/>
  <text x="302" y="230" class="n">no</text>
  <rect x="200" y="250" width="180" height="70" rx="12" class="bad"/>
  <text x="290" y="279" class="h" text-anchor="middle">503</text>
  <text x="290" y="302" class="s" text-anchor="middle" style="fill:#FECDD3">no policy loaded</text>

  <path d="M880 205 V242" class="ln" marker-end="url(#a)"/>
  <text x="892" y="230" class="n">no</text>
  <rect x="790" y="250" width="180" height="70" rx="12" class="bad"/>
  <text x="880" y="279" class="h" text-anchor="middle">503</text>
  <text x="880" y="302" class="s" text-anchor="middle" style="fill:#FECDD3">chain not loaded</text>

  <!-- default chain -->
  <path d="M700 205 V367" class="ln" marker-end="url(#a)"/>
  <text x="712" y="290" class="n">no</text>
  <polygon points="625,430 700,375 775,430 700,485" class="dia"/>
  <text x="700" y="426" class="b" text-anchor="middle">default_chain</text>
  <text x="700" y="446" class="b" text-anchor="middle">set?</text>

  <path d="M775 430 H982" class="ln" marker-end="url(#a)"/>
  <text x="878" y="420" class="y" text-anchor="middle">yes</text>
  <rect x="990" y="390" width="174" height="80" rx="12" class="ok"/>
  <text x="1077" y="424" class="h" text-anchor="middle">Run default chain</text>
  <text x="1077" y="447" class="s" text-anchor="middle" style="fill:#A7F3D0">503 if it is not loaded</text>

  <path d="M700 485 V512" class="ln" marker-end="url(#a)"/>
  <text x="712" y="504" class="n">no</text>
  <rect x="580" y="520" width="240" height="70" rx="12" class="warn"/>
  <text x="700" y="549" class="h" text-anchor="middle">Pass through</text>
  <text x="700" y="572" class="s" text-anchor="middle" style="fill:#FDE68A">no policy is applied</text>

  <!-- match semantics -->
  <rect x="36" y="370" width="520" height="220" rx="12" class="box"/>
  <text x="56" y="400" class="h">Match semantics</text>
  <text x="56" y="428" class="b">matches[]: any one match selects the route (OR)</text>
  <text x="56" y="454" class="b">inside one match: every set field must hold (AND)</text>
  <text x="56" y="480" class="b">path_prefix and path_regex_pattern test the raw :path,</text>
  <text x="56" y="500" class="b">including the query string</text>
  <text x="56" y="526" class="b">a header value of "*" only requires presence</text>
  <text x="56" y="552" class="b">operator: HyperRoutes are ordered by priority,</text>
  <text x="56" y="572" class="b">highest first</text>
</svg>

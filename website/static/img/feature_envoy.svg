<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="envoyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)">
    <!-- 3D Proxy Shield -->
    <path d="M 0 -60 L 50 -30 L 50 30 L 0 60 L -50 30 L -50 -30 Z" fill="rgba(99, 102, 241, 0.1)" stroke="url(#envoyGrad)" stroke-width="5" filter="url(#glow)"/>
    <path d="M 0 -60 L 0 60" stroke="url(#envoyGrad)" stroke-width="3" opacity="0.5"/>
    <path d="M -50 -30 L 50 30" stroke="url(#envoyGrad)" stroke-width="3" opacity="0.5"/>
    <path d="M -50 30 L 50 -30" stroke="url(#envoyGrad)" stroke-width="3" opacity="0.5"/>
    <!-- Glowing Nodes -->
    <circle cx="0" cy="0" r="10" fill="#fff" filter="url(#glow)"/>
    <circle cx="50" cy="-30" r="6" fill="#ec4899"/>
    <circle cx="-50" cy="30" r="6" fill="#6366f1"/>
  </g>
</svg>

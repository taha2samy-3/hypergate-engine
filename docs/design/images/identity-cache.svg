<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Identity cache internals</title>
  <desc id="d">On every operator replica, informers for Pods, EndpointSlices, Services, Nodes and, when Cilium is installed, CiliumEndpoints trim each object to the fields the index needs. The index keeps pods by UID with the claimants of each IP, service membership counted across slices, services by cluster IP, node addresses and Cilium identities. Lookups by IP return a pod workload, otherwise a node.</desc>
  <defs>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .h { font-size: 16px; font-weight: 700; }
      .b { font-size: 14px; }
      .s { font-size: 12.5px; fill: #94A3B8; }
      .cap { font-size: 12.5px; fill: #94A3B8; letter-spacing: 0.08em; }
      .box { fill: #1E293B; stroke: #334155; stroke-width: 1.5; }
      .cy { fill: #1E293B; stroke: #22D3EE; stroke-width: 2; }
      .acc { fill: #1E293B; stroke: #6366F1; stroke-width: 2; }
      .inner { fill: #0F172A; stroke: #334155; stroke-width: 1.2; }
      .ok { fill: #0B2A22; stroke: #10B981; stroke-width: 2; }
      .warn { fill: #2D1F05; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 6 4; }
      .ln { stroke: #94A3B8; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" rx="18" fill="#0F172A"/>
  <rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="30" y="52" class="cap">INFORMERS (EVERY REPLICA) · TRIMMED OBJECTS</text>
  <text x="420" y="52" class="cap">INDEX</text>
  <text x="900" y="52" class="cap">READ</text>

  <!-- informers -->
  <rect x="30" y="70" width="320" height="70" rx="10" class="cy"/>
  <text x="48" y="98" class="b">Pods</text>
  <text x="48" y="120" class="s">uid · sa · node · podIPs · phase · allowed labels</text>

  <rect x="30" y="156" width="320" height="70" rx="10" class="cy"/>
  <text x="48" y="184" class="b">EndpointSlices</text>
  <text x="48" y="206" class="s">service name · endpoint pod UIDs / IPs</text>

  <rect x="30" y="242" width="320" height="70" rx="10" class="cy"/>
  <text x="48" y="270" class="b">Services</text>
  <text x="48" y="292" class="s">clusterIPs · ports (headless: no IP)</text>

  <rect x="30" y="328" width="320" height="70" rx="10" class="cy"/>
  <text x="48" y="356" class="b">Nodes</text>
  <text x="48" y="378" class="s">InternalIP / ExternalIP addresses</text>

  <rect x="30" y="414" width="320" height="84" rx="10" class="warn"/>
  <text x="48" y="442" class="b">CiliumEndpoints</text>
  <text x="48" y="464" class="s">status.identity.id and labels</text>
  <text x="48" y="484" class="s">only when the CRD exists (re-checked)</text>

  <!-- index -->
  <rect x="420" y="70" width="400" height="428" rx="14" class="acc"/>
  <text x="440" y="100" class="h">Index</text>
  <text x="560" y="100" class="s">RWMutex · generation counter</text>

  <rect x="440" y="116" width="360" height="72" rx="9" class="inner"/>
  <text x="456" y="140" class="b">pods by UID, claimants per IP</text>
  <text x="456" y="160" class="s">newest pod wins during IP reuse; a late</text>
  <text x="456" y="178" class="s">delete only drops its own claim</text>

  <rect x="440" y="198" width="360" height="56" rx="9" class="inner"/>
  <text x="456" y="222" class="b">service membership</text>
  <text x="456" y="242" class="s">reference-counted across a Service's slices</text>

  <rect x="440" y="264" width="360" height="56" rx="9" class="inner"/>
  <text x="456" y="288" class="b">services by cluster IP</text>
  <text x="456" y="308" class="s">IPv4 and IPv6, one entry per address</text>

  <rect x="440" y="330" width="360" height="56" rx="9" class="inner"/>
  <text x="456" y="354" class="b">node addresses</text>
  <text x="456" y="374" class="s">hostNetwork pods resolve to their node</text>

  <rect x="440" y="396" width="360" height="86" rx="9" class="inner"/>
  <text x="456" y="420" class="b">Cilium identity by pod</text>
  <text x="456" y="440" class="s">joined on namespace/name; may arrive</text>
  <text x="456" y="460" class="s">before the pod</text>

  <!-- arrows -->
  <path d="M350 105 H 432" class="ln" marker-end="url(#a)"/>
  <path d="M350 191 C 395 191, 400 226, 432 226" class="ln" marker-end="url(#a)"/>
  <path d="M350 277 C 395 277, 400 292, 432 292" class="ln" marker-end="url(#a)"/>
  <path d="M350 363 H 432" class="ln" marker-end="url(#a)"/>
  <path d="M350 456 C 395 456, 400 439, 432 439" class="ln" marker-end="url(#a)"/>

  <!-- read side -->
  <rect x="900" y="70" width="270" height="150" rx="12" class="ok"/>
  <text x="918" y="98" class="h">Lookup(ip)</text>
  <text x="918" y="122" class="s">pod: namespace, pod, service</text>
  <text x="918" y="142" class="s">account, SPIFFE ID, labels,</text>
  <text x="918" y="162" class="s">services, Cilium identity</text>
  <text x="918" y="186" class="s">else node: node name</text>
  <text x="918" y="206" class="s">else unknown</text>

  <rect x="900" y="240" width="270" height="70" rx="12" class="ok"/>
  <text x="918" y="268" class="b">ServiceByClusterIP(ip)</text>
  <text x="918" y="290" class="s">destination Service</text>

  <rect x="900" y="330" width="270" height="70" rx="12" class="ok"/>
  <text x="918" y="358" class="b">Workloads() · Services()</text>
  <text x="918" y="380" class="s">sorted snapshot</text>

  <rect x="900" y="420" width="270" height="78" rx="12" class="warn"/>
  <text x="918" y="448" class="b">Phase 3: delta xDS server</text>
  <text x="918" y="470" class="s">leader streams the index</text>
  <text x="918" y="488" class="s">to every engine</text>

  <path d="M820 145 H 892" class="ln" marker-end="url(#a)"/>
  <path d="M820 275 H 892" class="ln" marker-end="url(#a)"/>
  <path d="M820 365 H 892" class="ln" marker-end="url(#a)"/>
  <path d="M820 459 H 892" class="ln" marker-end="url(#a)"/>

  <!-- footer -->
  <rect x="30" y="522" width="1140" height="56" rx="12" class="box"/>
  <text x="50" y="546" class="b">Off by default: --identity-cache (chart: operator.identity.enabled). Metrics:</text>
  <text x="50" y="566" class="s">hypergate_identity_cache_synced, hypergate_identity_cache_entries{kind="pod_ip"|"node_ip"|"service"}</text>
</svg>
